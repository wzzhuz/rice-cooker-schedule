name: 自动编译与验收

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright 与 Chromium
        run: |
          python -m pip install --quiet playwright
          playwright install --with-deps chromium

      - name: 校验 · 构建 · 生成预览
        run: python .github/scripts/build.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: rice-cooker-build
          path: |
            dist/
            电饭煲预约助手_项目归档.zip
          retention-days: 30

      - name: 启用 GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传 Pages 产物
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: 部署 Pages（原型在线预览）
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

    # 本作业无需 environment 声明：deploy-pages 会自行创建 github-pages 环境
